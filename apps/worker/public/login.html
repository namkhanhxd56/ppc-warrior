<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>PPC Warrior — Đăng nhập</title>
<style>
  * { box-sizing:border-box; }
  body { font-family:-apple-system,Segoe UI,Arial,sans-serif; margin:0; background:#101828; color:#1b2330;
    min-height:100vh; display:flex; align-items:center; justify-content:center; }
  .box { background:#fff; border-radius:14px; padding:28px 30px; width:360px; box-shadow:0 24px 80px rgba(0,0,0,.45); }
  h1 { font-size:18px; margin:0 0 2px; } .sub { font-size:12px; color:#667; margin:0 0 16px; }
  .tabs { display:flex; gap:6px; margin-bottom:14px; }
  .tabs button { flex:1; padding:8px; border:none; border-radius:7px; background:#eef1f7; font-weight:600; cursor:pointer; font-size:13px; }
  .tabs button.active { background:#2455e6; color:#fff; }
  label { font-size:12px; color:#667; display:block; margin:10px 0 4px; }
  input { width:100%; padding:9px 11px; border:1px solid #ccd3e0; border-radius:7px; font-size:13.5px; }
  .go { width:100%; margin-top:16px; padding:10px; border:none; border-radius:8px; background:#2455e6; color:#fff; font-weight:700; font-size:13.5px; cursor:pointer; }
  .msg { font-size:12px; margin-top:10px; min-height:16px; }
  .msg.err { color:#c0392b; } .msg.ok { color:#128a43; }
  .note { font-size:11px; color:#8a94a8; margin-top:12px; line-height:1.6; }
</style>
</head>
<body>
<div class="box">
  <h1>⚔️ PPC Warrior</h1>
  <p class="sub">Mỗi tài khoản có phân vùng dữ liệu riêng</p>
  <div class="tabs">
    <button id="tabLogin" class="active" onclick="mode='login';syncTab()">Đăng nhập</button>
    <button id="tabReg" onclick="mode='reg';syncTab()">Đăng ký</button>
  </div>
  <label>Tên đăng nhập</label>
  <input type="text" id="u" placeholder="a-z 0-9 _ - (3-20 ký tự)" autocomplete="username">
  <label>Mật khẩu</label>
  <input type="password" id="p" placeholder="tối thiểu 6 ký tự" autocomplete="current-password">
  <div id="p2wrap" style="display:none">
    <label>Nhập lại mật khẩu</label>
    <input type="password" id="p2">
  </div>
  <button class="go" id="go" onclick="submit()">Đăng nhập</button>
  <div class="msg" id="msg"></div>
  <div class="note" id="note"></div>
</div>
<script>
let mode = 'login';
const $ = (id) => document.getElementById(id);
function syncTab() {
  $('tabLogin').classList.toggle('active', mode === 'login');
  $('tabReg').classList.toggle('active', mode === 'reg');
  $('p2wrap').style.display = mode === 'reg' ? '' : 'none';
  $('go').textContent = mode === 'login' ? 'Đăng nhập' : 'Tạo tài khoản';
  $('msg').textContent = '';
}
(async () => {
  try {
    const r = await (await fetch('/api/auth/me')).json();
    if (r.user) { location.href = '/'; return; }
    if (!r.hasUsers) {
      mode = 'reg'; syncTab();
      $('note').textContent = '💡 Chưa có tài khoản nào — tài khoản ĐẦU TIÊN đăng ký sẽ là ADMIN và sở hữu toàn bộ dữ liệu hiện có.';
    }
  } catch {}
})();
async function submit() {
  const username = $('u').value.trim(), password = $('p').value;
  if (mode === 'reg' && password !== $('p2').value) { show('Mật khẩu nhập lại không khớp', true); return; }
  $('go').disabled = true;
  try {
    const r = await (await fetch('/api/auth/' + (mode === 'login' ? 'login' : 'register'), {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password }) })).json();
    if (r.error) { show(r.error, true); }
    else {
      show(r.first ? '✅ Đã tạo tài khoản ADMIN — đang vào...' : '✅ Thành công — đang vào...', false);
      setTimeout(() => location.href = '/', 500);
    }
  } catch (e) { show('Lỗi kết nối: ' + e.message, true); }
  $('go').disabled = false;
}
function show(m, err) { $('msg').textContent = m; $('msg').className = 'msg ' + (err ? 'err' : 'ok'); }
document.addEventListener('keydown', (e) => { if (e.key === 'Enter') submit(); });
</script>
</body>
</html>
